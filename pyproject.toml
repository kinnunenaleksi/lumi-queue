[project]
name = "lumi-queue"
version = "0.1.0"
description = "Lumi Queue Time Predictions."
readme = "README.md"
requires-python = "==3.11.7"
dependencies = [
    "ipykernel>=7.2.0",
    "joblib>=1.5.3",
    "numpy>=2.4.2",
    "polars>=1.38.1",
    "pyarrow>=23.0.1",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
]

[tool.ruff]
line-length = 88

[tool.docformatter]
wrap-descriptions=0
wrap-summaries=88
force-wrap=true
pre-summary-newline = false
make-summary-multi-line = false
# style="epytext"
# non-strict=true
