[project]
name = "lumi-queue"
version = "0.1.0"
description = "Lumi Queue Time Predictions."
readme = "README.md"
requires-python = "==3.11.7"
dependencies = [
    "ipykernel>=7.2.0",
    "jinja2>=3.1.6",
    "joblib>=1.5.3",
    "jsonpickle>=4.1.1",
    "numpy>=2.4.2",
    "polars>=1.38.1",
    "pyarrow>=23.0.1",
    "pytest>=9.0.2",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
    "xgboost>=3.2.0",
]

[tool.pytest.ini_options]
# Formatting
addopts= '-s'
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%H:%M:%S"

testpaths = ['tests']

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ['I']
# ignore = ['I001']

[too.ruff.lint.isort]
combine-as-imports = true

[tool.docformatter]
wrap-descriptions=0
wrap-summaries=88
force-wrap=true
pre-summary-newline = false
make-summary-multi-line = false


